name: Desktop verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project WidgetVerification/Portable/UsageWidget.ProcessVerification.csproj -c Release -- artifacts/portable-checks
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: ./build-widget.ps1 -OutputDirectory artifacts/windows-build
        shell: pwsh
      - run: npm test --prefix WidgetUI
      - name: Windows release pipeline checks
        run: ./WidgetVerification/ReleasePipelineChecks.ps1
        shell: pwsh
