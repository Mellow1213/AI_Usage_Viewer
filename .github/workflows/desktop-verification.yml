name: Desktop verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project WidgetVerification/Portable/UsageWidget.ProcessVerification.csproj -c Release -- artifacts/portable-checks
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: ./build-widget.ps1 -OutputDirectory artifacts/windows-build
        shell: pwsh
      - run: npm test --prefix WidgetUI
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Native fixture checks
        run: ./MacUsageWidget/verify.sh
      - name: Build and verify signature
        env:
          AI_USAGE_DEBUG_SYMBOLS: '1'
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun swiftc --version
          ./build-macos.sh
          codesign --verify --deep --strict 'artifacts/macos/AI Usage.app'
      - name: Verification runner regression checks
        run: python3 -m unittest discover -s MacUsageWidget/Tests -p 'test_ui_runner.py' -v
      - name: WebKit fixture checks
        run: |
          python3 MacUsageWidget/Tests/run-ui-verification.py \
            'artifacts/macos/AI Usage.app' artifacts/macos/ui-test
      - name: Prepare distribution
        run: |
          version=$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' UsageWidget/UsageWidget.csproj)
          arch=$(uname -m)
          mkdir -p artifacts/macos-distribution
          ditto -c -k --sequesterRsrc --keepParent 'artifacts/macos/AI Usage.app' "artifacts/macos-distribution/AIUsageWidget-$version-macos-$arch.zip"
          python3 -c 'import json,os; json.dump({"sourceCommit":os.environ["GITHUB_SHA"],"version":"'"$version"'","architecture":"'"$arch"'"},open("artifacts/macos-distribution/build-'"$arch"'.json","w"))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.runner }}
          path: artifacts/macos-distribution/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-checks-${{ matrix.runner }}
          path: |
            artifacts/macos/verification/**/results.json
            artifacts/macos/ui-test/*
            artifacts/macos/AIUsageWidget.dSYM/**
